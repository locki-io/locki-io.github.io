<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Seed — You mint, lucky you</title>
    <style>
      html, body { margin: 0; height: 100%; background: #07070c; color: #e8e8f0; font-family: Roboto, system-ui, sans-serif; overflow: hidden; }
      #seed { position: absolute; inset: 0; }
      .title { position: absolute; left: 5vw; top: 6vh; pointer-events: none; }
      .title h1 { font-weight: 300; letter-spacing: .08em; font-size: clamp(18px, 2.2vw, 28px); margin: 0; opacity: .9; }
      .title p { margin: .4em 0 0; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; opacity: .45; }
      /* the stream: on the right, one line per breath */
      .stream { position: absolute; right: 5vw; top: 50%; transform: translateY(-50%); margin: 0; padding: 0; list-style: none;
                font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; line-height: 2; text-align: right;
                color: #9fb0ff; pointer-events: none; }
      .stream li { opacity: 0; transform: translateX(12px); transition: opacity .9s ease, transform .9s ease; }
      .stream li.on { opacity: .85; transform: none; }
      body.collapsed .stream { color: #c8d0ff; }
      body.born .stream li { opacity: .35; }
      body.born .title p::after { content: " · the thread is born"; opacity: .8; }
    </style>
  </head>
  <body>
    <div id="seed" aria-hidden="true"></div>
    <div class="title">
      <h1>You mint — lucky you.</h1>
      <p>Act I · the seed</p>
    </div>
    <ol id="stream" class="stream" aria-label="the seed's mint record"></ol>
    <script type="module" src="/src/seed.js"></script>
  </body>
</html>
